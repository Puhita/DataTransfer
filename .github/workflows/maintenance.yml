# Free Supabase projects have no backups. Keep-alive lives in keepalive.yml.
# Add repo secret: SUPABASE_DB_URL (connection string, session pooler).
name: Database backup
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          pg_dump "${{ secrets.SUPABASE_DB_URL }}" --schema=public --no-owner -Fc -f backup.dump
      - uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: backup.dump
          retention-days: 14
