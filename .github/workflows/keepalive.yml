# Free Supabase projects pause after 7 days without activity.
# This runs a real query against Postgres (via the REST API) every 5 days.
# Repo secrets needed: SUPABASE_URL, SUPABASE_ANON_KEY (the public/publishable key).
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 3 */5 * *'
  workflow_dispatch:
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        run: |
          curl -fsS --retry 3 --retry-delay 10 \
            "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null -w "HTTP %{http_code}\n"
